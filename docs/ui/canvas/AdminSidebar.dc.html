<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>IELTSpace · Component · Sidebar Quản lý</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=IBM+Plex+Serif:wght@500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;family=Be+Vietnam+Pro:wght@400;600&amp;display=swap">
<style>
body{margin:0}
a{color:#2963CC}a:hover{color:#2257B8}

</style>
</helmet>
<div style="{{rootStyle}}">
<div style="padding: 4px 4px 8px; display: flex; align-items: center; gap: 8px; {{logoRow}}"><a href="AdminHome.dc.html" title="IELTSpace" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #352637; font-weight: 700; font-size: 18px"><span style="flex: none; width: 32px; height: 32px; border-radius: 10px; border: 1.5px solid #D6D4D0; box-sizing: border-box; background: {{accent}}; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; color: {{onAccent}}">IS</span><sc-if value="{{open}}" hint-placeholder-val="{{ true }}"><span>IELTSpace</span></sc-if></a><a href="#" onClick="{{toggle}}" title="{{toggleLabel}}" aria-label="{{toggleLabel}}" aria-expanded="{{open}}" style="{{toggleStyle}}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M9 4v16"></path></svg></a></div><sc-if value="{{open}}" hint-placeholder-val="{{ true }}"><div style="padding: 0 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #706473; white-space: nowrap">Quản lý hệ thống</div></sc-if><sc-if value="{{closed}}" hint-placeholder-val="{{ false }}"><div style="height: 1.5px; background: #D6D4D0; margin: 0 8px"></div></sc-if><nav aria-label="Điều hướng Quản lý" style="display: flex; flex-direction: column; gap: 4px; margin-top: -8px"><a href="AdminHome.dc.html" title="Tổng quan" aria-label="Tổng quan" style="{{st.home}}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"></path><path d="M10 20v-6h4v6"></path></svg><sc-if value="{{open}}" hint-placeholder-val="{{ true }}"><span style="white-space: nowrap; overflow: hidden">Tổng quan</span></sc-if></a><a href="AdminUsers.dc.html" title="Người dùng" aria-label="Người dùng" style="{{st.users}}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M3 20a6 6 0 0 1 12 0"></path><circle cx="17" cy="9" r="2.5"></circle><path d="M16 14.5a5 5 0 0 1 5 5.5"></path></svg><sc-if value="{{open}}" hint-placeholder-val="{{ true }}"><span style="white-space: nowrap; overflow: hidden">Người dùng</span></sc-if></a><a href="AdminExams.dc.html" title="Bộ đề và đề thi" aria-label="Bộ đề và đề thi" style="{{st.exams}}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3z"></path><path d="M4 7v10c0 1.7 3.6 3 8 3s8-1.3 8-3V7"></path></svg><sc-if value="{{open}}" hint-placeholder-val="{{ true }}"><span style="white-space: nowrap; overflow: hidden">Bộ đề và đề thi</span></sc-if></a><a href="AdminSamples.dc.html" title="Quản lý bài mẫu" aria-label="Quản lý bài mẫu" style="{{st.samples}}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"></path><path d="M5 17a3 3 0 0 1 3-3h11"></path></svg><sc-if value="{{open}}" hint-placeholder-val="{{ true }}"><span style="white-space: nowrap; overflow: hidden">Quản lý bài mẫu</span></sc-if></a><a href="AdminGrading.dc.html" title="Theo dõi chấm bài" aria-label="Theo dõi chấm bài" style="{{st.grading}}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg><sc-if value="{{open}}" hint-placeholder-val="{{ true }}"><span style="white-space: nowrap; overflow: hidden">Theo dõi chấm bài</span></sc-if></a><a href="Notifications.dc.html" title="Thông báo" aria-label="Thông báo" style="{{st.notifications}}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg><sc-if value="{{open}}" hint-placeholder-val="{{ true }}"><span style="white-space: nowrap; overflow: hidden">Thông báo</span></sc-if><sc-if value="{{open}}" hint-placeholder-val="{{ true }}"><span style="margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 10px; background: #E5604A; color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">1</span></sc-if><sc-if value="{{closed}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; top: 9px; right: 14px; width: 8px; height: 8px; border-radius: 50%; background: #E5604A; border: 2px solid #FCFBF7"></span></sc-if></a><a href="StaffProfile.dc.html" title="Hồ sơ cá nhân" aria-label="Hồ sơ cá nhân" style="{{st.profile}}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg><sc-if value="{{open}}" hint-placeholder-val="{{ true }}"><span style="white-space: nowrap; overflow: hidden">Hồ sơ cá nhân</span></sc-if></a></nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent": {"editor": "color", "default": "#2963CC", "options": ["#2563EB", "#2963CC", "#0EA5E9", "#D4F26A"]}, "active": {"editor": "enum", "default": "home", "options": ["home", "users", "exams", "samples", "grading", "notifications", "profile"]}, "collapsed": {"editor": "boolean", "default": false}, "$preview": {"width": 248, "height": 1080}}'>
class Component extends DCLogic {
componentDidMount() {
  try { var v = window.localStorage.getItem('ieltspace-admin-nav'); if (v === '1' || v === '0') { this.setState({ collapsed: v === '1' }); } } catch (e) {}
}
renderVals() {
var accent = this.props.accent ?? '#2963CC';
var hx = String(accent).replace('#', '');
if (hx.length === 3) { hx = hx[0] + hx[0] + hx[1] + hx[1] + hx[2] + hx[2]; }
var nn = parseInt(hx, 16);
var lum = (0.299 * ((nn >> 16) & 255) + 0.587 * ((nn >> 8) & 255) + 0.114 * (nn & 255)) / 255;
var onAccent = lum > 0.6 ? '#1A1A1A' : '#FFFFFF';
var s = this.state || {}, P = this.props, self = this;
var closed = s.collapsed == null ? !!P.collapsed : s.collapsed;
var active = P.active || 'home';
var base = "position: relative; display: flex; align-items: center; gap: 12px; height: 44px; border-radius: 10px; box-sizing: border-box; font-size: 14px; text-decoration: none; ";
var pad = closed ? 'padding: 0; justify-content: center; width: 44px; margin: 0 auto; ' : 'padding: 0 14px; ';
var on = 'background: #E3ECFD; border: 1.5px solid #D6D4D0; color: #352637; font-weight: 600';
var off = 'border: 1.5px solid transparent; color: #4B3D4D; font-weight: 500';
var st = {};
["home", "users", "exams", "samples", "grading", "notifications", "profile"].forEach(function (k) { st[k] = base + pad + (k === active ? on : off); });
return { accent: accent, onAccent: onAccent, open: !closed, closed: closed, st: st,
  rootStyle: 'width: ' + (closed ? 76 : 248) + 'px; flex: 0 0 ' + (closed ? 76 : 248) + 'px; align-self: stretch; min-height: 100%; box-sizing: border-box; border-right: 1.5px solid #D6D4D0; '
    + 'padding: 20px ' + (closed ? 12 : 16) + 'px; display: flex; flex-direction: column; gap: 20px; background: #FCFBF7; transition: width 0.18s ease, flex-basis 0.18s ease; overflow: hidden',
  logoRow: closed ? 'flex-direction: column; gap: 14px' : 'justify-content: space-between',
  toggleLabel: closed ? 'Mở rộng thanh bên' : 'Thu gọn thanh bên',
  toggleStyle: 'flex: none; width: 36px; height: 36px; border-radius: 10px; border: 1.5px solid #D6D4D0; box-sizing: border-box; display: flex; align-items: center; justify-content: center; color: #706473; background: #FFFFFF; cursor: pointer',
  toggle: function (e) { if (e) { e.preventDefault(); } var nv = !closed; self.setState({ collapsed: nv });
    try { window.localStorage.setItem('ieltspace-admin-nav', nv ? '1' : '0'); } catch (err) {} } };
}
}
</script>
</body>
</html>
