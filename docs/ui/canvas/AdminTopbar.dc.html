<helmet>

<div style="font-family: 'Inter', 'Be Vietnam Pro', 'Segoe UI', system-ui, sans-serif; color: #352637; font-size: 15px; line-height: 1.6">
<header style="position: relative; z-index: 30; height: 68px; box-sizing: border-box; border-bottom: 1.5px solid #D6D4D0; padding: 0 32px; display: flex; align-items: center; justify-content: space-between; gap: 16px; background: #FCFBF7"><div style="font-size: 14px; color: #706473; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{crumb}}</div><div style="display: flex; align-items: center; gap: 14px"><a href="Notifications.dc.html" aria-label="Thông báo, 1 chưa đọc" style="position: relative; width: 42px; height: 42px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #D6D4D0; display: flex; align-items: center; justify-content: center; color: #352637; text-decoration: none; background: #FFFFFF"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg><span style="position: absolute; top: -4px; right: -4px; min-width: 20px; height: 20px; padding: 0 5px; box-sizing: border-box; border-radius: 10px; background: #E5604A; color: #FFFFFF; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; border: 2px solid #FFFFFF">1</span></a><div style="position: relative"><a href="#" onClick="{{toggle}}" aria-haspopup="menu" aria-expanded="{{open}}" aria-label="Mở menu tài khoản" style="display: flex; align-items: center; gap: 10px; padding: 3px 10px 3px 3px; border-radius: 999px; border: 1.5px solid {{btnBorder}}; background: {{btnBg}}; color: #352637; text-decoration: none; cursor: pointer"><span style="width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid #D6D4D0; box-sizing: border-box; background: #C5CEF5; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: #352637">{{initials}}</span><span style="font-size: 14px; font-weight: 600; white-space: nowrap">{{name}}</span><span style="display: flex; color: #706473"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span></a><sc-if value="{{open}}" hint-placeholder-val="{{ false }}"><div onClick="{{close}}" style="position: fixed; inset: 0; z-index: 40"></div><div role="menu" aria-label="Tài khoản" style="position: absolute; right: 0; top: 52px; z-index: 50; width: 288px; box-sizing: border-box; background: #FFFFFF; border: 1.5px solid #D6D4D0; border-radius: 18px; box-shadow: 0 1px 2px rgba(53, 38, 55, 0.04), 0 8px 24px rgba(53, 38, 55, 0.07); padding: 8px; display: flex; flex-direction: column; gap: 2px"><div style="display: flex; gap: 12px; align-items: center; padding: 10px 12px 12px"><span style="flex: none; width: 42px; height: 42px; border-radius: 50%; border: 1.5px solid #D6D4D0; box-sizing: border-box; background: #C5CEF5; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: #352637">{{initials}}</span><div style="min-width: 0"><div style="font-weight: 600; font-size: 15px">{{name}}</div><div style="font-size: 13px; color: #706473; overflow: hidden; text-overflow: ellipsis">{{email}}</div><div style="font-size: 13px; color: #706473">{{role}}</div></div></div><div style="height: 1px; background: #E6E4E0; margin: 2px 4px 4px"></div><a role="menuitem" href="StaffProfile.dc.html" style="display: flex; align-items: center; gap: 12px; height: 42px; padding: 0 12px; border-radius: 10px; color: #352637; font-size: 14px; font-weight: 500; text-decoration: none"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg> Hồ sơ cá nhân</a><div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 6px 6px 12px"><span style="display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 500"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg> Giao diện</span><div role="group" aria-label="Chế độ giao diện" style="display: inline-flex; gap: 2px; padding: 3px; border-radius: 10px; background: #F3F0EA"><a href="#" role="menuitemradio" aria-checked="{{isLight}}" data-theme-toggle="light" onClick="{{setLight}}" style="{{lightStyle}}">Sáng</a><a href="#" role="menuitemradio" aria-checked="{{isDark}}" data-theme-toggle="dark" onClick="{{setDark}}" style="{{darkStyle}}">Tối</a></div></div><div style="height: 1px; background: #E6E4E0; margin: 4px"></div><a role="menuitem" href="Main.dc.html" style="display: flex; align-items: center; gap: 12px; height: 42px; padding: 0 12px; border-radius: 10px; color: #352637; font-size: 14px; font-weight: 500; text-decoration: none; color: #C0412A; font-weight: 600"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4H5v16h5M15 8l4 4-4 4M19 12H9"></path></svg> Đăng xuất</a></div></sc-if></div></div></header>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"crumb": {"editor": "text", "default": "Quản lý / Tổng quan"}, "menuOpen": {"editor": "boolean", "default": false}, "userName": {"editor": null}, "initials": {"editor": null}, "email": {"editor": null}, "role": {"editor": null}, "$preview": {"width": 1192, "height": 420}}'>
class Component extends DCLogic {
componentDidMount() {
  var self = this;
  this._esc = function (e) { if (e.key === 'Escape' && self.state && self.state.open) { self.setState({ open: false }); } };
  document.addEventListener('keydown', this._esc);
}
componentWillUnmount() { document.removeEventListener('keydown', this._esc); }
renderVals() {
var s = this.state || {}, P = this.props, self = this;
var open = s.open == null ? !!P.menuOpen : s.open;
var theme = s.theme || 'light';
function stop(e) { if (e) { e.preventDefault(); } }
var on = "display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 8px; background: #FFFFFF; border: 1.5px solid #D6D4D0; font-size: 13px; font-weight: 600; color: #352637; text-decoration: none; cursor: pointer; white-space: nowrap; box-sizing: border-box", off = "display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 8px; border: 1.5px solid transparent; color: #706473; font-size: 13px; font-weight: 500; text-decoration: none; cursor: pointer; white-space: nowrap; box-sizing: border-box";
return { crumb: P.crumb || 'Quản lý / Tổng quan', name: P.userName || 'Trần Quản Lý', initials: P.initials || 'QL', email: P.email || 'admin@ieltspace.vn',
  role: P.role || 'Quản lý', open: open, isLight: theme === 'light', isDark: theme === 'dark',
  btnBg: open ? '#F3F0EA' : 'transparent', btnBorder: open ? '#D6D4D0' : 'transparent',
  lightStyle: theme === 'light' ? on : off, darkStyle: theme === 'dark' ? on : off,
  toggle: function (e) { stop(e); self.setState({ open: !open }); },
  close: function () { self.setState({ open: false }); },
  setLight: function (e) { stop(e); self.setState({ theme: 'light' }); },
  setDark: function (e) { stop(e); self.setState({ theme: 'dark' }); } };
}
}
</script>
</body>
</html>
