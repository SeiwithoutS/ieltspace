<div style="display: flex; flex-wrap: wrap; min-height: 900px"><div style="flex: 1 1 480px; min-width: 0; display: flex; flex-direction: column"><dc-import name="AuthHero" hint-size="100%,900px"></dc-import></div><div style="flex: 1 1 480px; min-width: 0; background: #FCFBF7; box-sizing: border-box; padding: 32px 24px 48px; display: flex; flex-direction: column; gap: 24px"><div style="display: flex; justify-content: flex-start"><a href="Main.dc.html" style="display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: #706473; text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg> Về trang chủ</a></div><div style="flex: 1; display: flex; align-items: center; justify-content: center"><div style="width: 100%; max-width: 420px"><sc-if value="{{isLogin}}" hint-placeholder-val="{{ true }}"><dc-import name="LoginForm" email="{{email}}" password="{{password}}" error="{{error}}" submit-href="{{submitHref}}" set-email="{{setEmail}}" set-password="{{setPassword}}" do-submit="{{submit}}" go-register="{{toRegister}}" fill-demo="{{fill}}" hint-size="100%,640px"></dc-import></sc-if><sc-if value="{{isRegister}}" hint-placeholder-val="{{ false }}"><dc-import name="RegisterForm" go-login="{{toLogin}}" hint-size="100%,720px"></dc-import></sc-if></div></div></div></div>
</div>

<script type="text/x-dc" data-dc-script data-props='{"start": {"editor": "enum", "default": "login", "options": ["login", "register"]}, "previewError": {"editor": "enum", "default": "", "options": ["", "wrong", "unverified", "locked"]}, "$preview": {"width": 1440, "height": 900}}'>
class Component extends DCLogic {
renderVals() {
var s = this.state || {}, P = this.props, self = this;
var ACC = {"minhanh@email.com": {"role": "learner", "href": "StudentLanding.dc.html"}, "lanhuong@ieltspace.vn": {"role": "teacher", "href": "TeacherHome.dc.html"}, "admin@ieltspace.vn": {"role": "admin", "href": "AdminHome.dc.html"}, "moi@email.com": {"role": "unverified", "href": null}, "khoa@email.com": {"role": "locked", "href": null}};
var mode = s.mode || P.start || 'login';
var email = s.email == null ? '' : s.email, pw = s.password == null ? '' : s.password;
var acc = ACC[email.trim().toLowerCase()];
var href = acc && acc.href && pw.length >= 8 ? acc.href : '#';

function stop(e) { if (e) { e.preventDefault(); } }
return { isLogin: mode === 'login', isRegister: mode === 'register', email: email, password: pw, error: err, submitHref: href,

  setPassword: function (e) { self.setState({ password: e.target.value, error: '' }); },
  submit: function (e) { if (href !== '#') { return; } stop(e);
    var r = acc ? acc.role : ''; self.setState({ error: r === 'unverified' ? 'unverified' : r === 'locked' ? 'locked' : 'wrong' }); },
  fill: function (m) { self.setState({ email: m, password: 'matkhau123', error: '' }); },

}
</script>
