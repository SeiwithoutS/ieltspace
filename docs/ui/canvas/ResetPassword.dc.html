<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>IELTSpace · Đặt mật khẩu mới</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=IBM+Plex+Serif:wght@500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;family=Be+Vietnam+Pro:wght@400;600&amp;display=swap">
<style>
body{margin:0}
a{color:#2963CC}a:hover{color:#2257B8}

</style>
</helmet>
<div style="font-family: 'Inter', 'Be Vietnam Pro', 'Segoe UI', system-ui, sans-serif; color: #352637; background: #FCFBF7; font-size: 15px; line-height: 1.6">
<div style="min-height: 900px; background: #FCFBF7; padding: 48px 20px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 32px"><a href="Main.dc.html" style="display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: #352637; font-weight: 700; font-size: 18px"><span style="width: 32px; height: 32px; border-radius: 10px; background: #2963CC; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; color: #FFFFFF">IS</span><span>IELTSpace</span></a><main style="width: 100%; max-width: 440px; background: #FFFFFF; border: 1.5px solid #D6D4D0; border-radius: 22px; box-shadow: 0 1px 2px rgba(53, 38, 55, 0.04), 0 8px 24px rgba(53, 38, 55, 0.07); padding: 36px 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px"><h1 style="margin: 0; font-family: 'IBM Plex Serif', Georgia, serif; font-size: 28px; font-weight: 600; line-height: 1.2; letter-spacing: -0.015em; color: #352637; ">Đặt mật khẩu mới</h1><p style="margin: 0; font-size: 15px; line-height: 1.6; color: #706473; ">Liên kết đặt lại chỉ dùng được một lần.</p><label for="rp-new" style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 600; color: #352637">Mật khẩu mới</span><input id="rp-new" type="password" placeholder="••••••••" value="{{pw}}" onChange="{{setPw}}" autocomplete="new-password" style="height: 46px; padding: 0 14px; box-sizing: border-box; width: 100%; border: 1.5px solid #8E8392; border-radius: 12px; background: #FFFFFF; color: #352637; font: inherit; font-size: 15px; outline-color: #2963CC"><span style="font-size: 13px; color: #706473">Tối thiểu 8 ký tự</span></label><label for="rp-confirm" style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 600; color: #352637">Nhập lại mật khẩu mới</span><input id="rp-confirm" type="password" placeholder="••••••••" value="{{pw2}}" onChange="{{setPw2}}" autocomplete="new-password" style="height: 46px; padding: 0 14px; box-sizing: border-box; width: 100%; border: 1.5px solid #8E8392; border-radius: 12px; background: #FFFFFF; color: #352637; font: inherit; font-size: 15px; outline-color: #2963CC"></label><sc-if value="{{tooShort}}" hint-placeholder-val="{{ false }}"><div style="display: flex; align-items: flex-start; gap: 10px; background: #FBDCD3; border: 1px solid #F1B3A3; color: #C0412A; border-radius: 12px; padding: 10px 14px; font-size: 14px"><span style="flex: none; display: flex; padding-top: 1px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l10 18H2z"></path><path d="M12 10v5M12 18h.01"></path></svg></span><span>Mật khẩu cần tối thiểu 8 ký tự.</span></div></sc-if><sc-if value="{{mismatch}}" hint-placeholder-val="{{ false }}"><div style="display: flex; align-items: flex-start; gap: 10px; background: #FBDCD3; border: 1px solid #F1B3A3; color: #C0412A; border-radius: 12px; padding: 10px 14px; font-size: 14px"><span style="flex: none; display: flex; padding-top: 1px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l10 18H2z"></path><path d="M12 10v5M12 18h.01"></path></svg></span><span>Hai mật khẩu không khớp.</span></div></sc-if><a href="{{doneHref}}" onClick="{{save}}" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 22px; border-radius: 999px; background: #352637; color: #FFFFFF; font-weight: 600; font-size: 15px; text-decoration: none; ">Cập nhật mật khẩu</a><div style="text-align: center; font-size: 14px"><a href="Login.dc.html" style="color: #2963CC; font-weight: 600; text-decoration: none">Quay lại đăng nhập</a></div></main></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1440, "height": 900}}'>
class Component extends DCLogic {
constructor(...args) {
  super(...args);
  this.state = { pw: '', pw2: '', touched: false };
}
renderVals() {
  const pw = this.state.pw;
  const pw2 = this.state.pw2;
  const touched = this.state.touched;
  const short = pw.length < 8;
  const differ = pw !== pw2;
  const valid = !short && !differ;
  const tooShort = short && (touched || pw.length > 0);
  const mismatch = !short && differ && (touched || pw2.length > 0);
  const setPw = (e) => this.setState({ pw: e.target.value });
  const setPw2 = (e) => this.setState({ pw2: e.target.value });
  const save = (e) => {
    if (!valid) {
      if (e && e.preventDefault) { e.preventDefault(); }
      this.setState({ touched: true });
    }
  };
  return { pw: pw, pw2: pw2, tooShort: tooShort, mismatch: mismatch,
           doneHref: valid ? 'Login.dc.html' : '#', setPw: setPw, setPw2: setPw2, save: save };
}
}
</script>
</body>
</html>
